<text x="450" y="76" font-size="30" letter-spacing="7">THE LETTER THAT WAITED</text>
<text x="150" y="390" font-size="34">Worry</text><text x="450" y="390" font-size="34">Hiding</text><text x="750" y="390" font-size="34">Relief</text>
<text x="150" y="431" font-size="17">“What if it goes wrong?”</text><text x="450" y="431" font-size="17">“I will do it tomorrow.”</text><text x="750" y="431" font-size="17">“Better… for a moment.”</text>
<text x="450" y="492" font-size="19" letter-spacing="2">THE RELIEF CAN MAKE HIDING TEMPTING AGAIN.</text>
